<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!--
    PLACEHOLDER hero motif — swap for the generated image.
    Composition to preserve (the headline sits bottom-left):
      · horizon low, roughly the lower third
      · left half quiet — no busy detail behind the type
      · wind turbines on the horizon, centre to right
      · one low modern building right of centre, grounded on the dike
      · dark enough at the bottom for white text
    Generation prompt: docs/hero-image-prompt.md
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#131d22"/>
      <stop offset="30%"  stop-color="#26353b"/>
      <stop offset="58%"  stop-color="#4e5b57"/>
      <stop offset="78%"  stop-color="#96805f"/>
      <stop offset="92%"  stop-color="#c69a63"/>
      <stop offset="100%" stop-color="#d8ac74"/>
    </linearGradient>

    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffdaa4" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#e5a33c" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#c9662c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="marshFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b6a53"/>
      <stop offset="100%" stop-color="#3f4740"/>
    </linearGradient>

    <linearGradient id="dike" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d4a3d"/>
      <stop offset="100%" stop-color="#1e2721"/>
    </linearGradient>

    <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#18201c"/>
      <stop offset="100%" stop-color="#0d100e"/>
    </linearGradient>

    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#39443f"/>
      <stop offset="100%" stop-color="#1f2723"/>
    </linearGradient>

    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d8ac74" stop-opacity="0"/>
      <stop offset="60%"  stop-color="#d8ac74" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d8ac74" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hazy" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="1300" cy="720" rx="560" ry="250" fill="url(#sun)"/>

  <!-- Wind turbines: hazy far cluster, centre to right, clear of the type -->
  <g fill="none" stroke-linecap="round" filter="url(#hazy)">
    <g stroke="#1c2a2c" opacity="0.28" stroke-width="2.4">
      <path d="M980 726 V636"/>
      <g transform="translate(980 636) rotate(16)">
        <path d="M0 0 L0 -54"/><path d="M0 0 L47 27"/><path d="M0 0 L-47 27"/>
      </g>
      <path d="M1112 728 V652"/>
      <g transform="translate(1112 652) rotate(-8)">
        <path d="M0 0 L0 -46"/><path d="M0 0 L40 23"/><path d="M0 0 L-40 23"/>
      </g>
      <path d="M1830 726 V628"/>
      <g transform="translate(1830 628) rotate(28)">
        <path d="M0 0 L0 -58"/><path d="M0 0 L50 29"/><path d="M0 0 L-50 29"/>
      </g>
    </g>

    <g stroke="#16211f" opacity="0.42" stroke-width="3.2">
      <path d="M1608 730 V596"/>
      <g transform="translate(1608 596) rotate(-18)">
        <path d="M0 0 L0 -78"/><path d="M0 0 L68 39"/><path d="M0 0 L-68 39"/>
      </g>
      <path d="M1724 730 V622"/>
      <g transform="translate(1724 622) rotate(34)">
        <path d="M0 0 L0 -64"/><path d="M0 0 L55 32"/><path d="M0 0 L-55 32"/>
      </g>
    </g>

    <!-- Nearest turbine, still right of the headline column -->
    <g stroke="#101a18" opacity="0.6" stroke-width="4">
      <path d="M1466 734 V536"/>
      <g transform="translate(1466 536) rotate(10)">
        <path d="M0 0 L0 -112"/><path d="M0 0 L97 56"/><path d="M0 0 L-97 56"/>
      </g>
      <circle cx="1466" cy="536" r="5" fill="#101a18" stroke="none"/>
    </g>
  </g>

  <!-- Far marsh band and the water channel catching the last light -->
  <rect x="0" y="726" width="1920" height="52" fill="url(#marshFar)" opacity="0.85"/>
  <g fill="#f0cf9a" opacity="0.4">
    <rect x="1060" y="742" width="420" height="3" rx="1.5"/>
    <rect x="1180" y="756" width="250" height="2.5" rx="1.25"/>
  </g>

  <!-- The dike: one long, calm line -->
  <path d="M0 812 C 460 770, 1180 764, 1920 800 L1920 920 L0 920 Z" fill="url(#dike)"/>
  <path d="M0 812 C 460 770, 1180 764, 1920 800"
        stroke="#8a9470" stroke-opacity="0.22" stroke-width="2" fill="none"/>

  <!-- Low modern building, right of centre, grounded on the dike -->
  <g>
    <ellipse cx="1386" cy="800" rx="250" ry="14" fill="#0b0e0c" opacity="0.45" filter="url(#soft)"/>

    <!-- ground floor, set into the dike -->
    <rect x="1226" y="726" width="322" height="80" fill="url(#facade)"/>
    <!-- cantilevered upper volume, oversailing to the left -->
    <rect x="1196" y="668" width="382" height="60" fill="#2b352f"/>
    <rect x="1196" y="664" width="382" height="5" fill="#e5a33c" opacity="0.42"/>

    <!-- warm window bands -->
    <g fill="#f2c078" opacity="0.78">
      <rect x="1244" y="744" width="52" height="30"/>
      <rect x="1308" y="744" width="52" height="30"/>
      <rect x="1372" y="744" width="52" height="30"/>
      <rect x="1436" y="744" width="52" height="30"/>
      <rect x="1500" y="744" width="30" height="30"/>
    </g>
    <g fill="#cda067" opacity="0.45">
      <rect x="1216" y="684" width="66" height="26"/>
      <rect x="1296" y="684" width="66" height="26"/>
      <rect x="1376" y="684" width="66" height="26"/>
      <rect x="1456" y="684" width="66" height="26"/>
      <rect x="1536" y="684" width="30" height="26"/>
    </g>

    <!-- reflection of the lit band on the dike face -->
    <rect x="1244" y="806" width="286" height="26" fill="#e5a33c" opacity="0.07" filter="url(#soft)"/>
  </g>

  <!-- Foreground marsh, dark enough to carry white type -->
  <path d="M0 878 C 420 842, 1200 852, 1920 872 L1920 1080 L0 1080 Z" fill="url(#fore)"/>
  <rect x="0" y="700" width="1920" height="380" fill="url(#mist)"/>

  <!-- A few grass strokes on the near edge, right side only -->
  <g stroke="#2a3730" stroke-width="1.8" stroke-linecap="round" opacity="0.6">
    <path d="M1704 1004 C 1712 978, 1718 962, 1714 944"/>
    <path d="M1734 1012 C 1742 986, 1746 970, 1744 952"/>
    <path d="M1776 1000 C 1784 974, 1790 958, 1786 940"/>
    <path d="M1852 1016 C 1860 990, 1864 974, 1862 956"/>
  </g>
</svg>
